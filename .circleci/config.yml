version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  build:
    docker:
      - image: cimg/python:3.10-browsers
        environment:
          PIPENV_VENV_IN_PROJECT: true
          DJANGO_ENV: test
    working_directory: ~/repo
    steps:
      - checkout
      - node/install:
          node-version: "18.12.1"
      - restore_cache:
          keys:
            - python-dependencies-{{ checksum "Pipfile.lock" }}
            - python-dependencies-
      - run:
          name: Installing Python dependencies
          command: |
            pip install pipenv
            pipenv sync --dev
      - save_cache:
          paths:
            - ~/repo/.venv
          key: python-dependencies-{{ checksum "Pipfile.lock" }}
      - restore_cache:
          keys:
            - node-dependencies-{{ checksum "package-lock.json" }}
            - node-dependencies-
      - run:
          name: Installing Node dependencies
          command: |
            npm set cache .npm
            npm ci
      - save_cache:
          paths:
            - .npm
          key: node-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Running tests
          command: |
            sudo apt update && sudo apt install -y sassc cssmin
            npm install -g uglify-js
            pipenv run python manage.py collectstatic --noinput
            pipenv run coverage run manage.py test
            pipenv run coverage report
            pipenv run coverage html
      - run:
          name: Running black
          command: |
            pipenv run black . --check
      - run:
          name: Running flake8
          command: |
            pipenv run flake8 . --statistic --exclude .venv
      - run:
          name: Running isort
          command: |
            pipenv run isort **/*.py --check-only --verbose
      - store_artifacts:
          path: htmlcov

workflows:
  build-and-test:
    jobs:
      - build
