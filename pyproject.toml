[project]
name = "contuga-web"
version = "0.1.0"
description = "Simple web-based expense manager application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==4.2.*",
    "django-pipeline==3.0.*",
    "django-sekizai==4.1.*",
    "django-widget-tweaks==1.5.*",
    "django-registration==3.4.*",
    "django-extensions",
    "django-anymail[mailjet]>=10.*",
    "django-recaptcha>=3.0.*",
    "django-split-settings>=1.2.*",
    "django-filter==23.*",
    "django-import-export>=3.3.*",
    "djangorestframework==3.14.*",
    "markdown>=3.4.*",
    "python-dateutil==2.8.*",
    "django-parler>=2.3.*",
    "django-debug-toolbar>=4.0.*",
    "psycopg2-binary>=2.9.*",
    "setuptools",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flake8 = "<6.0.0"
ipdb = "*"
black = "*"
pre-commit = "*"
wily = "*"
bandit = "*"
coverage = "*"
isort = "*"
selenium = "4.*"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
