[project]
name = "contuga-web"
version = "0.1.0"
description = "Simple web-based expense manager application."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-pipeline>=4.1.0,<5",
    "django-sekizai>=4.1.0,<5",
    "django-widget-tweaks>=1.5.1,<2",
    "django-registration>=5.2.1,<6",
    "django-extensions>=4.1.0,<5",
    "django-anymail[mailjet]>=15.2,<16",
    "django-recaptcha>=4.1.0,<5",
    "django-split-settings>=1.3.2,<2",
    "django-filter>=24.3,<25",
    "django-import-export>=4.4.3,<5",
    "djangorestframework>=3.15.2,<3.17",
    "markdown>=3.8,<4",
    "coreapi>=2.3.3,<3",
    "python-dateutil>=2.8,<3",
    "django-parler>=2.4,<3",
    "django-debug-toolbar>=8.0,<9",
    "psycopg2>=2.9,<3",
    "setuptools>=75.0.0,<81",
    "pytz (>=2026.5,<2027.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flake8 = ">=7,<8"
ipdb = ">=0.13,<1"
black = ">=25,<26"
pre-commit = ">=4,<5"
wily = ">=1.25,<2"
bandit = ">=1.8,<2"
coverage = ">=7,<8"
isort = ">=6,<7"
selenium = ">=4.32,<5"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
